<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMM Fee Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #1a2332 50%, #0d1b2a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 2em;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .subtitle {
            color: #8ab4f8;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        h2, h3 {
            color: #00d4ff;
        }

        .form-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 2px solid rgba(0, 153, 255, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #00d4ff;
            font-size: 0.9em;
        }

        input {
            padding: 10px 12px;
            border: 2px solid rgba(0, 153, 255, 0.3);
            border-radius: 6px;
            font-size: 1em;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        input:focus {
            outline: none;
            border-color: #0099ff;
            box-shadow: 0 0 0 3px rgba(0, 153, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-calculate {
            background: linear-gradient(135deg, #0099ff 0%, #00d4ff 100%);
            color: white;
            flex: 1;
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 153, 255, 0.5);
            background: linear-gradient(135deg, #00b3ff 0%, #00e6ff 100%);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1);
            color: #00d4ff;
            border: 2px solid rgba(0, 153, 255, 0.3);
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #0099ff;
        }

        .results-section {
            margin-top: 30px;
        }

        .results-log {
            max-height: 600px;
            overflow-y: auto;
        }

        .calculation-result {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(0, 153, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0, 153, 255, 0.2);
            cursor: pointer;
        }

        .result-header:hover {
            border-bottom-color: rgba(0, 153, 255, 0.4);
        }

        .result-title {
            font-weight: 600;
            color: #00d4ff;
            font-size: 1.1em;
        }

        .result-timestamp {
            color: #8ab4f8;
            font-size: 0.85em;
        }

        .collapse-indicator {
            color: #0099ff;
            font-size: 1.2em;
            margin-left: 10px;
            transition: transform 0.3s;
        }

        .collapse-indicator.collapsed {
            transform: rotate(-90deg);
        }

        .result-summary {
            color: #8ab4f8;
            font-size: 0.95em;
            margin-top: 10px;
        }

        .result-details {
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .result-details.collapsed {
            max-height: 0;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .result-table th,
        .result-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 153, 255, 0.1);
            color: #ffffff;
        }

        .result-table th {
            background: rgba(0, 153, 255, 0.15);
            font-weight: 600;
            color: #00d4ff;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-table tr:hover {
            background: rgba(0, 153, 255, 0.05);
        }

        .yearly-row {
            background: rgba(0, 153, 255, 0.15) !important;
            font-weight: 600;
        }

        .apy-row {
            background: rgba(0, 212, 255, 0.15) !important;
            font-weight: 600;
        }

        .value-positive {
            color: #00ff88;
        }

        .value-highlight {
            font-weight: 600;
            color: #00d4ff;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #8ab4f8;
        }

        .console-log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .console-line {
            margin-bottom: 5px;
            line-height: 1.5;
        }

        .console-key {
            color: #9cdcfe;
        }

        .console-value {
            color: #ce9178;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔷 AMM Fee Calculator</h1>
        <p class="subtitle">Calculate trading fees and their distribution across DAO, LP, and Asset Issuers</p>

        <div class="form-section">
            <h2 style="margin-bottom: 20px; color: #333;">Input Parameters</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="usdValue">Value of the Pool ($)</label>
                    <input type="number" id="usdValue" value="962184.62" step="0.01">
                </div>
                <div class="form-group">
                    <label for="avgLiquidity">Average Daily Liquidity Utilisation</label>
                    <input type="number" id="avgLiquidity" value="0.02" step="0.01">
                </div>
                <div class="form-group">
                    <label for="tradingVolume">Trading Volume ($)</label>
                    <input type="number" id="tradingVolume" value="19243.69" step="0.01">
                </div>
                <div class="form-group">
                    <label for="totalTradingFeeRate">Total Trading Fee per Day (rate)</label>
                    <input type="number" id="totalTradingFeeRate" value="0.005" step="0.001">
                </div>
            </div>

            <h3 style="margin: 20px 0 15px 0; color: #495057;">Fee Distribution Splits</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="daoFeeSplit">Curve Dao Fee (split ratio)</label>
                    <input type="number" id="daoFeeSplit" value="0.5" step="0.01" min="0" max="1">
                </div>
                <div class="form-group">
                    <label for="toLPSplit">Liquidity Provider Fee (split ratio)</label>
                    <input type="number" id="toLPSplit" value="0.5" step="0.01" min="0" max="1">
                </div>
                <div class="form-group">
                    <label for="toAssetIssuersSplit">To Asset Issuers (split ratio)</label>
                    <input type="number" id="toAssetIssuersSplit" value="0" step="0.01" min="0" max="1">
                </div>
                <div class="form-group">
                    <label for="control">Control calculation (Needs to be 100%)</label>
                    <input type="number" id="control" value="100" step="0.01">
                </div>
            </div>

            <div class="button-group">
                <button class="btn-calculate" onclick="calculateFees()">Calculate Fees</button>
                <button class="btn-clear" onclick="clearResults()">Clear History</button>
            </div>
        </div>

        <div class="results-section">
            <h2 style="margin-bottom: 20px; color: #333;">Calculation Results</h2>
            <div id="resultsLog" class="results-log">
                <div class="no-results">
                    No calculations yet. Enter your parameters and click "Calculate Fees" to see results.
                </div>
            </div>
        </div>
    </div>

    <script>
        let calculationCount = 0;

        function calculateFees() {
            calculationCount++;

            // Get input values
            const usdValue = parseFloat(document.getElementById('usdValue').value) || 0;
            const avgLiquidity = parseFloat(document.getElementById('avgLiquidity').value) || 0;
            const tradingVolume = parseFloat(document.getElementById('tradingVolume').value) || 0;
            const totalTradingFeeRate = parseFloat(document.getElementById('totalTradingFeeRate').value) || 0;
            const daoFeeSplit = parseFloat(document.getElementById('daoFeeSplit').value) || 0;
            const toLPSplit = parseFloat(document.getElementById('toLPSplit').value) || 0;
            const toAssetIssuersSplit = parseFloat(document.getElementById('toAssetIssuersSplit').value) || 0;
            const control = parseFloat(document.getElementById('control').value) || 0;

            // Calculate fee amounts
            const totalTradingFeeAmount = tradingVolume * totalTradingFeeRate;
            const daoFeeAmount = totalTradingFeeAmount * daoFeeSplit;
            const toLPAmount = totalTradingFeeAmount * toLPSplit;
            const toAssetIssuersAmount = totalTradingFeeAmount * toAssetIssuersSplit;

            // Calculate yearly projections (assuming daily trading, 365 days)
            const yearlyTotalTradingFee = totalTradingFeeAmount * 365;
            const yearlyDaoFee = daoFeeAmount * 365;
            const yearlyToLP = toLPAmount * 365;
            const yearlyToAssetIssuers = toAssetIssuersAmount * 365;

            // Calculate APY (Annual Percentage Yield)
            const apyTotalTradingFee = usdValue > 0 ? (yearlyTotalTradingFee / usdValue) * 100 : 0;
            const apyDaoFee = usdValue > 0 ? (yearlyDaoFee / usdValue) * 100 : 0;
            const apyToLP = usdValue > 0 ? (yearlyToLP / usdValue) * 100 : 0;
            const apyToAssetIssuers = usdValue > 0 ? (yearlyToAssetIssuers / usdValue) * 100 : 0;

            // Create result object
            const result = {
                timestamp: new Date().toLocaleString(),
                inputs: {
                    usdValue,
                    avgLiquidity,
                    tradingVolume,
                    totalTradingFeeRate,
                    daoFeeSplit,
                    toLPSplit,
                    toAssetIssuersSplit,
                    control
                },
                calculations: {
                    daily: {
                        totalTradingFeeAmount,
                        daoFeeAmount,
                        toLPAmount,
                        toAssetIssuersAmount
                    },
                    yearly: {
                        yearlyTotalTradingFee,
                        yearlyDaoFee,
                        yearlyToLP,
                        yearlyToAssetIssuers
                    },
                    apy: {
                        apyTotalTradingFee,
                        apyDaoFee,
                        apyToLP,
                        apyToAssetIssuers
                    }
                }
            };

            // Log to console
            console.log('='.repeat(80));
            console.log(`CALCULATION #${calculationCount} - ${result.timestamp}`);
            console.log('='.repeat(80));
            console.log('INPUTS:');
            console.log(`  USD Value: $${formatNumber(usdValue)}`);
            console.log(`  AVG Liquidity Utilisation: ${avgLiquidity}`);
            console.log(`  Trading Volume: $${formatNumber(tradingVolume)}`);
            console.log(`  Total Trading Fee Rate: ${totalTradingFeeRate} (${(totalTradingFeeRate * 100).toFixed(2)}%)`);
            console.log(`  DAO Fee Split: ${daoFeeSplit}`);
            console.log(`  To LP Split: ${toLPSplit}`);
            console.log(`  To Asset Issuers Split: ${toAssetIssuersSplit}`);
            console.log(`  Control: ${control}%`);
            console.log('');
            console.log('DAILY CALCULATIONS:');
            console.log(`  Total Trading Fee: $${formatNumber(totalTradingFeeAmount)}`);
            console.log(`  DAO Fee: $${formatNumber(daoFeeAmount)}`);
            console.log(`  To LP: $${formatNumber(toLPAmount)}`);
            console.log(`  To Asset Issuers: $${formatNumber(toAssetIssuersAmount)}`);
            console.log('');
            console.log('YEARLY PROJECTIONS:');
            console.log(`  Total Trading Fee: $${formatNumber(yearlyTotalTradingFee)}`);
            console.log(`  DAO Fee: $${formatNumber(yearlyDaoFee)}`);
            console.log(`  To LP: $${formatNumber(yearlyToLP)}`);
            console.log(`  To Asset Issuers: $${formatNumber(yearlyToAssetIssuers)}`);
            console.log('');
            console.log('APY:');
            console.log(`  Total Trading Fee APY: ${apyTotalTradingFee.toFixed(2)}%`);
            console.log(`  DAO Fee APY: ${apyDaoFee.toFixed(2)}%`);
            console.log(`  To LP APY: ${apyToLP.toFixed(2)}%`);
            console.log(`  To Asset Issuers APY: ${apyToAssetIssuers.toFixed(2)}%`);
            console.log('='.repeat(80));
            console.log('');

            // Display result in UI
            displayResult(result, calculationCount);
        }

        function displayResult(result, count) {
            const resultsLog = document.getElementById('resultsLog');

            // Remove "no results" message if it exists
            if (resultsLog.querySelector('.no-results')) {
                resultsLog.innerHTML = '';
            }

            const resultDiv = document.createElement('div');
            resultDiv.className = 'calculation-result';

            const r = result.calculations;

            resultDiv.innerHTML = `
                <div class="result-header" onclick="toggleDetails(this)">
                    <div style="display: flex; align-items: center;">
                        <div class="result-title">Calculation #${count}</div>
                        <span class="collapse-indicator">▼</span>
                    </div>
                    <div class="result-timestamp">${result.timestamp}</div>
                </div>

                <div class="result-summary">
                    <strong>Yearly Total:</strong> $${formatNumber(r.yearly.yearlyTotalTradingFee)} |
                    <strong>APY:</strong> ${r.apy.apyTotalTradingFee.toFixed(2)}% |
                    <strong>Curve DAO:</strong> $${formatNumber(r.yearly.yearlyDaoFee)} (${r.apy.apyDaoFee.toFixed(2)}%) |
                    <strong>LP:</strong> $${formatNumber(r.yearly.yearlyToLP)} (${r.apy.apyToLP.toFixed(2)}%)
                </div>

                <div class="result-details collapsed">
                    <div class="console-log">
                    <div class="console-line"><span style="color: #4ec9b0;">================================================================================</span></div>
                    <div class="console-line"><span style="color: #dcdcaa;">CALCULATION #${count}</span> - <span style="color: #ce9178;">${result.timestamp}</span></div>
                    <div class="console-line"><span style="color: #4ec9b0;">================================================================================</span></div>
                    <div class="console-line"><span style="color: #569cd6; font-weight: bold;">INPUTS:</span></div>
                    <div class="console-line">  <span class="console-key">Value of the Pool:</span> <span class="console-value">$${formatNumber(result.inputs.usdValue)}</span></div>
                    <div class="console-line">  <span class="console-key">Average Daily Liquidity Utilisation:</span> <span class="console-value">${result.inputs.avgLiquidity}</span></div>
                    <div class="console-line">  <span class="console-key">Trading Volume:</span> <span class="console-value">$${formatNumber(result.inputs.tradingVolume)}</span></div>
                    <div class="console-line">  <span class="console-key">Total Trading Fee per Day Rate:</span> <span class="console-value">${result.inputs.totalTradingFeeRate}</span> <span style="color: #b5cea8;">(${(result.inputs.totalTradingFeeRate * 100).toFixed(2)}%)</span></div>
                    <div class="console-line">  <span class="console-key">Curve Dao Fee Split:</span> <span class="console-value">${result.inputs.daoFeeSplit}</span></div>
                    <div class="console-line">  <span class="console-key">Liquidity Provider Fee Split:</span> <span class="console-value">${result.inputs.toLPSplit}</span></div>
                    <div class="console-line">  <span class="console-key">To Asset Issuers Split:</span> <span class="console-value">${result.inputs.toAssetIssuersSplit}</span></div>
                    <div class="console-line">  <span class="console-key">Control:</span> <span class="console-value">${result.inputs.control}%</span></div>
                    <div class="console-line" style="margin-top: 10px;"><span style="color: #569cd6; font-weight: bold;">DAILY CALCULATIONS:</span></div>
                    <div class="console-line">  <span class="console-key">Total Trading Fee:</span> <span style="color: #4ec9b0; font-weight: bold;">$${formatNumber(r.daily.totalTradingFeeAmount)}</span></div>
                    <div class="console-line">  <span class="console-key">Curve Dao Fee:</span> <span style="color: #4ec9b0; font-weight: bold;">$${formatNumber(r.daily.daoFeeAmount)}</span></div>
                    <div class="console-line">  <span class="console-key">Liquidity Provider Fee:</span> <span style="color: #4ec9b0; font-weight: bold;">$${formatNumber(r.daily.toLPAmount)}</span></div>
                    <div class="console-line">  <span class="console-key">To Asset Issuers:</span> <span style="color: #4ec9b0; font-weight: bold;">$${formatNumber(r.daily.toAssetIssuersAmount)}</span></div>
                    <div class="console-line" style="margin-top: 10px;"><span style="color: #569cd6; font-weight: bold;">YEARLY PROJECTIONS:</span></div>
                    <div class="console-line">  <span class="console-key">Total Trading Fee:</span> <span style="color: #dcdcaa; font-weight: bold;">$${formatNumber(r.yearly.yearlyTotalTradingFee)}</span></div>
                    <div class="console-line">  <span class="console-key">Curve Dao Fee:</span> <span style="color: #dcdcaa; font-weight: bold;">$${formatNumber(r.yearly.yearlyDaoFee)}</span></div>
                    <div class="console-line">  <span class="console-key">Liquidity Provider Fee:</span> <span style="color: #dcdcaa; font-weight: bold;">$${formatNumber(r.yearly.yearlyToLP)}</span></div>
                    <div class="console-line">  <span class="console-key">To Asset Issuers:</span> <span style="color: #dcdcaa; font-weight: bold;">$${formatNumber(r.yearly.yearlyToAssetIssuers)}</span></div>
                    <div class="console-line" style="margin-top: 10px;"><span style="color: #569cd6; font-weight: bold;">APY:</span></div>
                    <div class="console-line">  <span class="console-key">Total Trading Fee APY:</span> <span style="color: #4fc1ff; font-weight: bold;">${r.apy.apyTotalTradingFee.toFixed(2)}%</span></div>
                    <div class="console-line">  <span class="console-key">Curve Dao Fee APY:</span> <span style="color: #4fc1ff; font-weight: bold;">${r.apy.apyDaoFee.toFixed(2)}%</span></div>
                    <div class="console-line">  <span class="console-key">Liquidity Provider Fee APY:</span> <span style="color: #4fc1ff; font-weight: bold;">${r.apy.apyToLP.toFixed(2)}%</span></div>
                    <div class="console-line">  <span class="console-key">To Asset Issuers APY:</span> <span style="color: #4fc1ff; font-weight: bold;">${r.apy.apyToAssetIssuers.toFixed(2)}%</span></div>
                    <div class="console-line"><span style="color: #4ec9b0;">================================================================================</span></div>
                </div>

                <table class="result-table">
                    <thead>
                        <tr>
                            <th>WETH/INV</th>
                            <th>Value of Pool</th>
                            <th>Avg Daily Liq. Util.</th>
                            <th>Trading Volume</th>
                            <th>Total Trading Fee</th>
                            <th>Curve Dao Fee</th>
                            <th>LP Fee</th>
                            <th>Asset Issuers</th>
                            <th>Control</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td></td>
                            <td>$${formatNumber(result.inputs.usdValue)}</td>
                            <td>${result.inputs.avgLiquidity}</td>
                            <td>$${formatNumber(result.inputs.tradingVolume)}</td>
                            <td>${result.inputs.totalTradingFeeRate}</td>
                            <td>${result.inputs.daoFeeSplit}</td>
                            <td>${result.inputs.toLPSplit}</td>
                            <td>${result.inputs.toAssetIssuersSplit}</td>
                            <td>${result.inputs.control}%</td>
                        </tr>
                        <tr>
                            <td><strong>Daily</strong></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td class="value-positive">$${formatNumber(r.daily.totalTradingFeeAmount)}</td>
                            <td class="value-positive">$${formatNumber(r.daily.daoFeeAmount)}</td>
                            <td class="value-positive">$${formatNumber(r.daily.toLPAmount)}</td>
                            <td class="value-positive">$${formatNumber(r.daily.toAssetIssuersAmount)}</td>
                            <td></td>
                        </tr>
                        <tr class="yearly-row">
                            <td><strong>Yearly</strong></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td class="value-highlight">$${formatNumber(r.yearly.yearlyTotalTradingFee)}</td>
                            <td class="value-highlight">$${formatNumber(r.yearly.yearlyDaoFee)}</td>
                            <td class="value-highlight">$${formatNumber(r.yearly.yearlyToLP)}</td>
                            <td class="value-highlight">$${formatNumber(r.yearly.yearlyToAssetIssuers)}</td>
                            <td></td>
                        </tr>
                        <tr class="apy-row">
                            <td><strong>APY</strong></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td class="value-highlight">${r.apy.apyTotalTradingFee.toFixed(2)}%</td>
                            <td class="value-highlight">${r.apy.apyDaoFee.toFixed(2)}%</td>
                            <td class="value-highlight">${r.apy.apyToLP.toFixed(2)}%</td>
                            <td class="value-highlight">${r.apy.apyToAssetIssuers.toFixed(2)}%</td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
                </div>
            `;

            // Insert at the top (newest first)
            resultsLog.insertBefore(resultDiv, resultsLog.firstChild);
        }

        function toggleDetails(headerElement) {
            const resultDiv = headerElement.closest('.calculation-result');
            const detailsDiv = resultDiv.querySelector('.result-details');
            const indicator = resultDiv.querySelector('.collapse-indicator');

            if (detailsDiv.classList.contains('collapsed')) {
                detailsDiv.classList.remove('collapsed');
                detailsDiv.style.maxHeight = detailsDiv.scrollHeight + 'px';
                indicator.classList.remove('collapsed');
            } else {
                detailsDiv.classList.add('collapsed');
                detailsDiv.style.maxHeight = '0';
                indicator.classList.add('collapsed');
            }
        }

        function formatNumber(num) {
            return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function clearResults() {
            const resultsLog = document.getElementById('resultsLog');
            resultsLog.innerHTML = `
                <div class="no-results">
                    No calculations yet. Enter your parameters and click "Calculate Fees" to see results.
                </div>
            `;
            calculationCount = 0;
            console.clear();
            console.log('Calculator history cleared.');
        }

        // Initial calculation on page load
        window.addEventListener('load', () => {
